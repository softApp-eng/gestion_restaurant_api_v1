spring.application.name=pos-hotel

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/pos-hotel-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Heure de cloture automatique de la caisse (cron), par defaut 23:59:00 tous les jours
app.cloture.cron=0 59 23 * * *

app.hotel.nom=Hotel
